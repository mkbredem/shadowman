---
# IdM connection / authentication
# Provided by an AAP credential/survey field or Ansible Vault in real
# executions - the values below are placeholders only.
ipaadmin_principal: admin
ipaadmin_password: ""

# --- Identity Settings ------------------------------------------------
idm_user_job_title: ""
idm_user_first_name: ""
idm_user_last_name: ""
idm_user_full_name: ""
idm_user_display_name: "Brad Krumme"
# Not currently exposed by the freeipa.ansible_freeipa ipauser module,
# kept here so it is available to the survey/tasks if support is added.
idm_user_initials: "BK"
idm_user_gecos: ""
idm_user_class: ""

# --- Account Settings ---------------------------------------------------
idm_user_login: "bkrumme"
# Leave blank to let IdM generate/require a reset on first login instead
# of setting an explicit password.
idm_user_password: ""
idm_user_random_password: false
# UID, GID, password expiration and the Kerberos principal alias are all
# generated by IdM on creation and are intentionally not set here.
idm_user_krb_principal_expiration: ""
idm_user_login_shell: "/bin/sh"
idm_user_home_directory: "/home/{{ idm_user_login }}"
idm_user_ssh_public_keys: []
idm_user_certificates: []
idm_user_certificate_mapping_data: []

# User authentication types: password, radius, otp, pkinit, hardened, idp
idm_user_auth_types: []
idm_user_radius_proxy_configuration: ""
idm_user_radius_proxy_username: ""
idm_user_external_idp_configuration: ""
idm_user_external_idp_user_identifier: ""

# --- Employee Information -----------------------------------------------
idm_user_org_unit: ""
idm_user_manager: ""
idm_user_department_numbers: []
idm_user_employee_number: ""
idm_user_employee_type: ""
idm_user_preferred_language: ""

# --- Misc. Information ---------------------------------------------------
idm_user_car_licenses: []

# --- Contact Settings ------------------------------------------------------
idm_user_email_addresses:
  - "bkrumme@shadowman.dev"
idm_user_telephone_numbers: []
idm_user_pager_numbers: []
idm_user_mobile_telephone_numbers: []
idm_user_fax_numbers: []

# --- Mailing Address ---------------------------------------------------------
idm_user_street_address: ""
idm_user_city: ""
idm_user_state_province: ""
idm_user_zip: ""

# --- Group memberships ----------------------------------------------------------
# Array of IdM user groups the account should be added to. Overridden per
# run by the AAP survey.
idm_user_groups:
  - admins
  - editors
  - hub_admins
  - ipausers
  - service
  - ssogroups
  - tower_admin
  - tower_admins
  - "trust admins"
  - vcenter_admins
  - vpn_users
