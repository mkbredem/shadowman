---
- name: Fetch a page of this organization's jobs
  ansible.builtin.uri:
    url: "{{ chargeback_controller_base_url }}{{ chargeback_next_verify_url }}"
    method: GET
    user: "{{ chargeback_controller_username }}"
    password: "{{ chargeback_controller_password }}"
    force_basic_auth: true
    validate_certs: "{{ chargeback_controller_validate_certs }}"
    return_content: true
  register: chargeback_verify_jobs_page

- name: Accumulate job ids from this page
  ansible.builtin.set_fact:
    chargeback_verify_job_ids: >-
      {{ chargeback_verify_job_ids + (chargeback_verify_jobs_page.json.results | map(attribute='id') | list) }}

- name: Determine the next jobs page
  ansible.builtin.set_fact:
    chargeback_next_verify_url: "{{ chargeback_verify_jobs_page.json.next | default('', true) }}"

- name: Recurse into the next jobs page
  ansible.builtin.include_tasks: fetch_verify_jobs_page.yml
  when: chargeback_next_verify_url | length > 0
