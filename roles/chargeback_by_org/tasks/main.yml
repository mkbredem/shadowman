---
- name: Validate required chargeback_by_org inputs
  ansible.builtin.assert:
    that:
      - chargeback_controller_hostname | length > 0
      - chargeback_controller_username | length > 0
      - chargeback_controller_password | length > 0
      - chargeback_from_date is match('^\d{4}-\d{2}-\d{2}$')
      - chargeback_to_date is match('^\d{4}-\d{2}-\d{2}$')
      - chargeback_to_date >= chargeback_from_date
    fail_msg: >-
      chargeback_controller_hostname, chargeback_controller_username,
      chargeback_controller_password, chargeback_from_date and
      chargeback_to_date are all required, and both dates must be in
      YYYY-MM-DD format with chargeback_to_date on or after
      chargeback_from_date.

- name: Compute the ISO8601 bounds of the reporting window
  ansible.builtin.set_fact:
    chargeback_from_iso: "{{ chargeback_from_date }}T00:00:00Z"
    chargeback_to_iso: "{{ chargeback_to_date }}T23:59:59Z"

- name: Normalize the controller hostname into a base URL
  # The AAP "Red Hat Ansible Automation Platform" credential injects
  # CONTROLLER_HOST as a bare hostname (no scheme), while a manually
  # supplied chargeback_controller_hostname may already include one.
  ansible.builtin.set_fact:
    chargeback_controller_base_url: >-
      {{
        (chargeback_controller_hostname is match('^https?://'))
        | ternary(chargeback_controller_hostname, 'https://' + chargeback_controller_hostname)
        | regex_replace('/+$', '')
      }}

- name: Reset the accumulated report
  ansible.builtin.set_fact:
    chargeback_report: []

- name: Determine which organizations to report on
  ansible.builtin.include_tasks: get_organizations.yml

- name: Count unique automated hosts per organization
  ansible.builtin.include_tasks: process_organization.yml
  loop: "{{ chargeback_org_list }}"
  loop_control:
    loop_var: chargeback_org
    label: "{{ chargeback_org.name }}"

- name: Write the chargeback report
  ansible.builtin.include_tasks: write_report.yml
