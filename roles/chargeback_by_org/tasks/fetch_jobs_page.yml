---
- name: Fetch a page of jobs for this organization
  ansible.builtin.uri:
    url: "{{ chargeback_controller_base_url }}{{ chargeback_next_jobs_url }}"
    method: GET
    user: "{{ chargeback_controller_username }}"
    password: "{{ chargeback_controller_password }}"
    force_basic_auth: true
    validate_certs: "{{ chargeback_controller_validate_certs }}"
    return_content: true
  register: chargeback_jobs_page

- name: Collect the hosts touched by each job on this page
  ansible.builtin.include_tasks: process_job.yml
  loop: "{{ chargeback_jobs_page.json.results }}"
  loop_control:
    loop_var: chargeback_job
    label: "{{ chargeback_job.id }}"

- name: Determine the next jobs page
  ansible.builtin.set_fact:
    chargeback_next_jobs_url: "{{ chargeback_jobs_page.json.next }}"

- name: Recurse into the next jobs page
  ansible.builtin.include_tasks: fetch_jobs_page.yml
  when: chargeback_next_jobs_url | default('') | length > 0
