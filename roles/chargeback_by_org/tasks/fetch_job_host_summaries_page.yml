---
- name: Fetch a page of job host summaries
  ansible.builtin.uri:
    url: "{{ chargeback_controller_base_url }}{{ chargeback_next_url }}"
    method: GET
    user: "{{ chargeback_controller_username }}"
    password: "{{ chargeback_controller_password }}"
    force_basic_auth: true
    validate_certs: "{{ chargeback_controller_validate_certs }}"
    return_content: true
  register: chargeback_jhs_page

- name: Accumulate hostnames from this page
  # Deduplicated once per organization in process_organization.yml rather than
  # on each page; running unique() over the growing list made this quadratic.
  ansible.builtin.set_fact:
    chargeback_hostnames_raw: >-
      {{ chargeback_hostnames_raw + (chargeback_jhs_page.json.results | map(attribute='host_name') | list) }}

- name: Determine the next job host summaries page
  # The API returns a JSON null on the final page, which would otherwise fail
  # the length test below; default(..., true) also treats null as empty.
  ansible.builtin.set_fact:
    chargeback_next_url: "{{ chargeback_jhs_page.json.next | default('', true) }}"

- name: Recurse into the next job host summaries page
  ansible.builtin.include_tasks: fetch_job_host_summaries_page.yml
  when: chargeback_next_url | length > 0
