---
- name: Ensure the output directory exists
  ansible.builtin.file:
    path: "{{ chargeback_output_dir }}"
    state: directory
    mode: "0750"
  when: chargeback_write_csv or chargeback_write_json

- name: Write the CSV chargeback report
  ansible.builtin.template:
    src: chargeback_report.csv.j2
    dest: "{{ chargeback_output_dir }}/{{ chargeback_output_basename }}.csv"
    mode: "0640"
  when: chargeback_write_csv

- name: Write the JSON chargeback report
  ansible.builtin.template:
    src: chargeback_report.json.j2
    dest: "{{ chargeback_output_dir }}/{{ chargeback_output_basename }}.json"
    mode: "0640"
  when: chargeback_write_json

- name: Print the chargeback summary
  ansible.builtin.debug:
    msg: >-
      {{ item.organization }}: {{ item.unique_host_count }} unique host(s)
      automated between {{ chargeback_from_date }} and {{ chargeback_to_date }},
      {{ item.shared_host_count }} shared with another organization,
      billable as {{ item.billable_hosts }} host(s)
  loop: "{{ chargeback_report | sort(attribute='organization') }}"
  loop_control:
    label: "{{ item.organization }}"
  when: chargeback_print_summary

- name: Publish the report as job artifacts
  # The files written above live inside the execution environment and are
  # discarded when it exits. set_stats surfaces the figures on the job itself,
  # which is the only durable output when this runs under AAP. Very large host
  # lists can exceed the Controller's event size limit (MAX_EVENT_RES).
  ansible.builtin.set_stats:
    data:
      chargeback_from_date: "{{ chargeback_from_date }}"
      chargeback_to_date: "{{ chargeback_to_date }}"
      chargeback_distinct_hosts: "{{ chargeback_all_hostnames | length }}"
      chargeback_billable_total: "{{ chargeback_report | map(attribute='billable_hosts') | sum | round(4) }}"
      chargeback_by_organization: "{{ chargeback_report | sort(attribute='organization') }}"
      chargeback_report_csv: "{{ lookup('template', 'chargeback_report.csv.j2') }}"
