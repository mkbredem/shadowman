---
# Walks this organization's jobs and reads the hosts from their job host
# summaries, which is the only source that survives a host being deleted from
# inventory. The module issues those per-job requests concurrently.
- name: Collect every host this organization automated in the window
  aap_org_hosts:
    base_url: "{{ chargeback_controller_base_url }}"
    api_base_path: "{{ chargeback_api_base_path }}"
    username: "{{ chargeback_controller_username }}"
    password: "{{ chargeback_controller_password }}"
    validate_certs: "{{ chargeback_controller_validate_certs }}"
    organization_id: "{{ chargeback_org.id }}"
    created_after: "{{ chargeback_from_iso }}"
    created_before: "{{ chargeback_to_iso }}"
    page_size: "{{ chargeback_page_size }}"
    threads: "{{ chargeback_threads }}"
  register: chargeback_org_hosts

- name: Record this organization's results
  ansible.builtin.set_fact:
    chargeback_report: >-
      {{ chargeback_report + [{
        'organization': chargeback_org.name,
        'organization_id': chargeback_org.id,
        'job_count': chargeback_org_hosts.job_count,
        'unique_host_count': chargeback_org_hosts.hostnames | length,
        'deleted_host_count': chargeback_org_hosts.deleted_hostnames | length,
        'hostnames': chargeback_org_hosts.hostnames
      }] }}
