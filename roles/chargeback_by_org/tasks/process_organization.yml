---
# One filtered query per organization. Traversing hosts -> job_host_summaries
# -> job -> organization attributes each host to the organization whose job
# automated it, rather than to the organization that owns its inventory.
- name: Reset per-organization host tracking
  ansible.builtin.set_fact:
    chargeback_hostnames_raw: []
    chargeback_next_url: >-
      {{ chargeback_api_base_path }}/hosts/?job_host_summaries__job__organization={{ chargeback_org.id }}&job_host_summaries__job__created__gte={{ chargeback_from_iso }}&job_host_summaries__job__created__lte={{ chargeback_to_iso }}&page_size={{ chargeback_page_size }}&order_by=id

- name: Walk the hosts this organization automated
  ansible.builtin.include_tasks: fetch_hosts_page.yml
  when: chargeback_next_url | length > 0

- name: Record this organization's results
  ansible.builtin.set_fact:
    chargeback_report: >-
      {{ chargeback_report + [{
        'organization': chargeback_org.name,
        'organization_id': chargeback_org.id,
        'unique_host_count': chargeback_hostnames_raw | unique | length,
        'hostnames': chargeback_hostnames_raw | unique | sort
      }] }}
