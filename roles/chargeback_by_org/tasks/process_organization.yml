---
- name: Reset per-organization host tracking
  ansible.builtin.set_fact:
    chargeback_hostnames_set: []
    chargeback_next_jobs_url: >-
      {{ chargeback_api_base_path }}/jobs/?organization={{ chargeback_org.id }}&created__gte={{ chargeback_from_iso }}&created__lte={{ chargeback_to_iso }}&page_size={{ chargeback_page_size }}&order_by=id

- name: Walk this organization's jobs, collecting the hosts each one touched
  ansible.builtin.include_tasks: fetch_jobs_page.yml
  when: chargeback_next_jobs_url | default('') | length > 0

- name: Record this organization's results
  ansible.builtin.set_fact:
    chargeback_report: >-
      {{ chargeback_report + [{
        'organization': chargeback_org.name,
        'organization_id': chargeback_org.id,
        'unique_host_count': chargeback_hostnames_set | length,
        'hostnames': chargeback_hostnames_set | sort
      }] }}
