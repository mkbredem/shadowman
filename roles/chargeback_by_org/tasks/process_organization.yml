---
- name: Reset per-organization host tracking
  ansible.builtin.set_fact:
    chargeback_hostnames_set: []
    chargeback_next_url: >-
      {{ chargeback_api_base_path }}/job_host_summaries/?job__organization={{ chargeback_org.id }}&job__created__gte={{ chargeback_from_iso }}&job__created__lte={{ chargeback_to_iso }}&page_size={{ chargeback_page_size }}&order_by=id

- name: Walk the paginated job host summaries for this organization
  ansible.builtin.include_tasks: fetch_job_host_summaries_page.yml
  when: chargeback_next_url | default('') | length > 0

- name: Record this organization's results
  ansible.builtin.set_fact:
    chargeback_report: >-
      {{ chargeback_report + [{
        'organization': chargeback_org.name,
        'organization_id': chargeback_org.id,
        'unique_host_count': chargeback_hostnames_set | length,
        'hostnames': chargeback_hostnames_set | sort
      }] }}
