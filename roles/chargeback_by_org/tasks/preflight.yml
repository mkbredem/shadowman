---
# The Controller registers job_host_summaries only as a sub-list under jobs and
# hosts, so there is no top-level collection to filter. Probe what this
# deployment actually supports before walking anything, so an unsupported
# filter surfaces in seconds with a diagnostic rather than part way through.
- name: Probe which Controller filters this deployment supports
  ansible.builtin.uri:
    url: "{{ chargeback_controller_base_url }}{{ chargeback_api_base_path }}/{{ item }}"
    method: GET
    user: "{{ chargeback_controller_username }}"
    password: "{{ chargeback_controller_password }}"
    force_basic_auth: true
    validate_certs: "{{ chargeback_controller_validate_certs }}"
    return_content: false
    status_code: [200, 400, 403, 404, 405]
  register: chargeback_probe
  loop:
    - "hosts/?job_host_summaries__job__organization={{ chargeback_org_list[0].id }}&page_size=1"
    - "hosts/?job_host_summaries__job__created__gte={{ chargeback_from_iso }}&page_size=1"
    - "job_host_summaries/?page_size=1"
    - "jobs/?organization={{ chargeback_org_list[0].id }}&created__gte={{ chargeback_from_iso }}&page_size=1"
  loop_control:
    label: "{{ item }}"

- name: Report what each probe returned
  ansible.builtin.debug:
    msg: "HTTP {{ item.status }} <- {{ item.item }}"
  loop: "{{ chargeback_probe.results }}"
  loop_control:
    label: "HTTP {{ item.status }}"

- name: Require the filters this report depends on
  ansible.builtin.assert:
    that:
      - chargeback_probe.results[0].status == 200
      - chargeback_probe.results[1].status == 200
    fail_msg: >-
      This Controller will not filter /hosts/ by job_host_summaries__job__*,
      so hosts cannot be attributed to the organization of the job that
      automated them in a single query. Probe results:
      {{ chargeback_probe.results | map(attribute='status') | list }}
      for {{ chargeback_probe.results | map(attribute='item') | list }}
    success_msg: >-
      Attributing hosts by the organization of the job that automated them,
      one query per organization.
