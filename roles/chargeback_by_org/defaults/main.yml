---
# --- Controller/Gateway connection ---------------------------------------
# Hostname/URL of the AAP gateway (2.5+) or Controller node, e.g.
# https://aap.example.com. When a "Red Hat Ansible Automation Platform"
# credential is attached to the Job Template, AAP injects these as the
# CONTROLLER_* environment variables (with TOWER_* kept as legacy
# aliases) and no survey/extra-vars are needed. Set the vars explicitly
# (survey, -e, or group_vars) to override or to run outside of AAP.
chargeback_controller_hostname: "{{ lookup('env', 'CONTROLLER_HOST') or lookup('env', 'TOWER_HOST') or '' }}"
chargeback_controller_username: "{{ lookup('env', 'CONTROLLER_USERNAME') or lookup('env', 'TOWER_USERNAME') or '' }}"
chargeback_controller_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') or lookup('env', 'TOWER_PASSWORD') or '' }}"
chargeback_controller_validate_certs: "{{ (lookup('env', 'CONTROLLER_VERIFY_SSL') or lookup('env', 'TOWER_VERIFY_SSL') or 'true') | bool }}"

# AAP 2.5+ fronts the Controller API behind the platform gateway at
# /api/controller/v2. Set this to /api/v2 instead if querying a
# pre-gateway Controller node directly.
chargeback_api_base_path: "/api/controller/v2"

# --- Reporting window (YYYY-MM-DD, inclusive on both ends) ----------------
chargeback_from_date: ""
chargeback_to_date: ""

# --- Scope -----------------------------------------------------------------
# Organization names to report on. Leave empty to report on every
# organization visible to chargeback_controller_username.
chargeback_organizations: []

# --- API paging --------------------------------------------------------------
# The Controller API caps page_size at 200 by default; raising this above
# the server's own limit has no effect.
chargeback_page_size: 200

# --- Output ------------------------------------------------------------------
chargeback_output_dir: "./chargeback_reports"
chargeback_output_basename: "chargeback_by_org_{{ chargeback_from_date }}_to_{{ chargeback_to_date }}"
chargeback_write_csv: true
chargeback_write_json: true
chargeback_print_summary: true

# --- Concurrency --------------------------------------------------------------
# Job host summaries are only reachable one job at a time, so the walk issues
# that request per job. They are independent and I/O bound, so they run
# concurrently; raise this to go faster against a Controller that can take it.
chargeback_threads: 16
